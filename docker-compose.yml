version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: pregao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pregao_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  openbao:
    image: hashicorp/vault:1.15
    container_name: pregao-openbao
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK

  vault-init:
    image: hashicorp/vault:1.15
    container_name: pregao-vault-init
    depends_on:
      - openbao
    volumes:
      - ./scripts/init-vault.sh:/init-vault.sh:ro
    entrypoint: ["/bin/sh", "/init-vault.sh"]

  pregao:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pregao-service
    restart: unless-stopped
    ports:
      - "50053:50053"
      - "8080:8080"
    environment:
      PORT: "50053"
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://pregao_user:pregao_pass@host.docker.internal:5432/bolsa?sslmode=disable&search_path=pregao"
      REDIS_ADDR: "redis:6379"
      OPENBAO_ADDR: "http://openbao:8200"
      OPENBAO_TOKEN: "root"
      OPENBAO_TRANSIT_KEY: "broker-keys"
      BINANCE_BASE_URL: "https://api.binance.com"
      LIVRO_GRPC_ADDR: "host.docker.internal:50051"
      ATIVOS_GRPC_ADDR: "host.docker.internal:50052"
      DEFAULT_BROKER: "BINANCE"
    depends_on:
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

volumes:
  pregao_redisdata:
