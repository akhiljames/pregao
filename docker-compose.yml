version: "3.8"

networks:
  default:
    name: platform-network
    external: true

services:
  pregao:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pregao-service
    restart: unless-stopped
    ports:
      - "50053:50053"
      - "8080:8080"
    environment:
      PORT: "50053"
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://pregao_user:pregao_pass@bolsa:5432/bolsa?sslmode=disable&search_path=pregao"
      REDIS_ADDR: "redis:6379"
      OPENBAO_ADDR: "http://openbao:8200"
      OPENBAO_TOKEN: "root"
      OPENBAO_TRANSIT_KEY: "broker-keys"
      BINANCE_BASE_URL: "https://api.binance.com"
      LIVRO_GRPC_ADDR: "livro:50051"
      ATIVOS_GRPC_ADDR: "ativos:50052"
      DEFAULT_BROKER: "BINANCE"
    extra_hosts:
      - "host.docker.internal:host-gateway"
